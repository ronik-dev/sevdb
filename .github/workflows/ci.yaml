name: CI

on: 
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: build docker image
        run: docker compose build dev
        
      - name: build project
        run: make build
        
      - name: run tests
        run: make test

  publish-image:
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: build and push
        run: |
          IMAGE=ghcr.io/${{ github.repository_owner }}/sevdb-dev
          docker compose build dev
          docker tag sevdb-dev $IMAGE:${{ github.sha }}
          docker tag sevdb-dev $IMAGE:latest
          docker push $IMAGE:${{ github.sha }}
          docker push $IMAGE:latest
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION="${{ github.ref_name }}"
            docker tag sevdb-dev $IMAGE:$VERSION
            docker push $IMAGE:$VERSION
          fi
